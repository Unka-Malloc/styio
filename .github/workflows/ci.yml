name: styio-all-in-one-ci

on:
  pull_request:
  push:
    branches:
      - ai-dev
      - nightly
      - stable
      - main
      - master
      - agent-dev

permissions:
  contents: read

jobs:
  styio-ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Run workflow scheduler prebuild chain
        shell: bash
        working-directory: styio
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/workflow-scheduler.py run --profile ci-prebuild --skip-tool team-docs-base --skip-tool ecosystem-cli-docs-workspace

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-18 \
            libclang-rt-18-dev \
            lld-18 \
            llvm-18-dev \
            libicu-dev \
            python3

      - name: Configure
        run: >
          cmake -S styio -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DSTYIO_ENABLE_FUZZ=ON

      - name: Build
        run: >
          cmake --build build/ci --target
          styio styio_test styio_algorithm_equivalence_test
          styio_security_test styio_resource_topology_test styio_ide_test
          styio_fuzz_suite

      - name: Docs audit
        run: ctest --test-dir build/ci -L docs --output-on-failure

      - name: Security tests
        run: ctest --test-dir build/ci -L security --output-on-failure

      - name: Five-layer pipeline tests
        run: ctest --test-dir build/ci -L styio_pipeline --output-on-failure

      - name: Parser shadow gate (scalar expressions suite + artifacts)
        run: |
          mkdir -p build/ci/parser-shadow-artifacts
          ./styio/benchmark/parser-shadow-suite-gate.sh ./build/ci/bin/styio ./styio/tests/features/scalar_expressions ./build/ci/parser-shadow-artifacts

      - name: Parser shadow gate (functions suite + artifacts)
        run: |
          mkdir -p build/ci/parser-shadow-artifacts-m2
          ./styio/benchmark/parser-shadow-suite-gate.sh ./build/ci/bin/styio ./styio/tests/features/functions ./build/ci/parser-shadow-artifacts-m2

      - name: Upload parser shadow artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: parser-shadow-artifacts
          path: |
            build/ci/parser-shadow-artifacts
            build/ci/parser-shadow-artifacts-m2
          if-no-files-found: ignore

      - name: Soak smoke tests
        run: ctest --test-dir build/ci -L soak_smoke --output-on-failure

      - name: Language feature smoke
        run: ctest --test-dir build/ci -R '^scalar_expressions_t01_int_arith$|^functions_t01_simple_func$' --output-on-failure

      - name: Fuzz smoke
        run: ctest --test-dir build/ci -L fuzz_smoke --output-on-failure

  styio-windows-native:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Set up MSVC command environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake, Ninja, and LLVM 18 development package
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: styio-llvm18
          cache-environment: true
          create-args: >-
            cmake
            ninja
            llvm=18.1.8
            llvmdev=18.1.8
            clang-tools=18.1.8
            zlib
            libxml2
            zstd

      - name: Locate LLVM 18
        shell: pwsh
        run: |
          $condaPrefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs\styio-llvm18"
          if (!(Test-Path $condaPrefix) -and $env:CONDA_PREFIX) {
            $condaPrefix = $env:CONDA_PREFIX
          }
          if (!(Test-Path $condaPrefix)) {
            throw "micromamba environment was not found"
          }

          $llvmRoot = Join-Path $condaPrefix "Library"
          $llvmConfig = Join-Path $llvmRoot "lib\cmake\llvm\LLVMConfig.cmake"
          if (!(Test-Path $llvmConfig)) {
            throw "LLVMConfig.cmake was not found in $llvmRoot"
          }

          $llvmDir = Split-Path -Parent $llvmConfig

          Add-Content $env:GITHUB_PATH (Join-Path $llvmRoot "bin")
          Add-Content $env:GITHUB_PATH (Join-Path $condaPrefix "Scripts")
          Add-Content $env:GITHUB_ENV "LLVM_DIR=$llvmDir"
          Add-Content $env:GITHUB_ENV "STYIO_NATIVE_TOOLCHAIN_ROOT=$llvmRoot"

      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          python --version
          where.exe cl
          clang --version

      - name: Configure
        shell: pwsh
        run: >
          cmake -S styio -B build/windows -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DLLVM_DIR="$env:LLVM_DIR"
          -DSTYIO_NATIVE_TOOLCHAIN_ROOT="$env:STYIO_NATIVE_TOOLCHAIN_ROOT"
          -DSTYIO_NATIVE_TOOLCHAIN_MODE=auto
          -DSTYIO_ENABLE_FUZZ=OFF

      - name: Build native compiler and IDE contract targets
        shell: pwsh
        run: >
          cmake --build build/windows --target
          styio styio_lspd styio_test

      - name: Syntax-check contract tests
        shell: pwsh
        run: >
          .\build\windows\bin\styio_test.exe
          --gtest_filter=StyioDiagnostics.SyntaxCheckRejectsNonAuthoritativeParserEngine
          --gtest_brief=1

  styio-macos-native:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Install CMake, Ninja, and LLVM 18 development package
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: styio-llvm18
          cache-environment: true
          create-args: >-
            cmake
            ninja
            llvm=18.1.8
            llvmdev=18.1.8
            clang-tools=18.1.8
            zlib
            libxml2
            zstd

      - name: Locate LLVM 18
        shell: bash
        run: |
          set -euo pipefail
          mamba_root="${MAMBA_ROOT_PREFIX:-${HOME}/micromamba}"
          conda_prefix="${CONDA_PREFIX:-${mamba_root}/envs/styio-llvm18}"
          if [[ ! -d "${conda_prefix}" ]]; then
            echo "micromamba environment was not found at ${conda_prefix}" >&2
            exit 1
          fi

          llvm_config="${conda_prefix}/lib/cmake/llvm/LLVMConfig.cmake"
          if [[ ! -f "${llvm_config}" ]]; then
            echo "LLVMConfig.cmake was not found in ${conda_prefix}" >&2
            exit 1
          fi

          llvm_dir="$(dirname "${llvm_config}")"
          echo "${conda_prefix}/bin" >> "${GITHUB_PATH}"
          echo "LLVM_DIR=${llvm_dir}" >> "${GITHUB_ENV}"
          echo "STYIO_NATIVE_TOOLCHAIN_ROOT=${conda_prefix}" >> "${GITHUB_ENV}"

      - name: Tool versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          python3 --version
          clang --version

      - name: Configure
        shell: bash
        run: >
          cmake -S styio -B build/macos -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DLLVM_DIR="${LLVM_DIR}"
          -DSTYIO_NATIVE_TOOLCHAIN_ROOT="${STYIO_NATIVE_TOOLCHAIN_ROOT}"
          -DSTYIO_NATIVE_TOOLCHAIN_MODE=auto
          -DSTYIO_ENABLE_FUZZ=OFF

      - name: Build native compiler and IDE contract targets
        shell: bash
        run: >
          cmake --build build/macos --target
          styio styio_lspd styio_test

      - name: Syntax-check contract tests
        shell: bash
        run: >
          ./build/macos/bin/styio_test
          --gtest_filter=StyioDiagnostics.SyntaxCheckRejectsNonAuthoritativeParserEngine
          --gtest_brief=1
