name: styio-nightly-soak

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  nightly-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-18 \
            lld-18 \
            llvm-18-dev \
            libicu-dev \
            python3

      - name: Configure
        run: >
          cmake -S styio -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build soak targets
        id: build_soak
        shell: bash
        run: |
          cmake --build build --target styio
          if cmake --build build --target styio_soak_test; then
            echo "has_soak=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_soak=false" >> "$GITHUB_OUTPUT"
            echo "External styio-benchmark probes are unavailable; skipping deep soak."
          fi

      - name: Run deep soak
        if: steps.build_soak.outputs.has_soak == 'true'
        run: |
          mkdir -p soak-artifacts
          ctest --test-dir build -L soak_deep --output-on-failure \
            | tee soak-artifacts/ctest-soak-deep.log

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-soak-artifacts
          path: soak-artifacts/
