name: vityo-local-ci

on:
  pull_request:
  push:
    branches:
      - ai-dev
      - nightly
      - stable
      - main
      - master
      - agent-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vityo-local-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STYIO_PYTHON_VERSION: "3.13.5"
      STYIO_NODE_VERSION: "24.15.0"
      STYIO_FLUTTER_VERSION: "3.41.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Set up standardized Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.STYIO_NODE_VERSION }}

      - name: Set up standardized Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.STYIO_FLUTTER_VERSION }}

      - name: Install CI Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify standardized toolchain
        run: |
          python3 --version | grep -F "${STYIO_PYTHON_VERSION}"
          node --version | grep -F "v${STYIO_NODE_VERSION}"
          npm --version
          flutter --version | head -n1 | grep -F "${STYIO_FLUTTER_VERSION}"
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version

      - name: Restore Vityo dependencies
        working-directory: vityo
        run: |
          python3 -m pip install coverage
          cd prototype && npm ci
          cd ../frontend/vityo_app && flutter pub get

      - name: Install Styio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-18 \
            lld-18 \
            llvm-18-dev \
            libicu-dev \
            python3

      - name: Build Styio language fixture parser
        run: |
          cmake -S . -B build/default -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build/default --target styio -j2

      - name: Resolve CI refs
        id: ci_refs
        shell: bash
        working-directory: vityo
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
            else
              BASE_REF="HEAD"
            fi
            RANGE="HEAD"
          else
            BASE_REF="${{ github.event.before }}"
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Run Vityo local delivery gate
        working-directory: vityo
        env:
          STYIO_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          STYIO: ${{ github.workspace }}/build/default/bin/styio
          VITYO_STYIO_ALL_IN_ONE_ROOT: ${{ github.workspace }}
        run: >
          bash scripts/delivery-gate.sh
          --mode push
          --base "${{ steps.ci_refs.outputs.base_ref }}"
          --range "${{ steps.ci_refs.outputs.range }}"
          --skip-audit
          --skip-ecosystem

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vityo-coverage-reports
          path: |
            vityo/.coverage
            vityo/frontend/vityo_app/coverage/lcov.info
          if-no-files-found: ignore
